version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      nx:
        patterns: ['nx', '@nx/*']
        applies-to: version-updates
      nx-security:
        patterns: ['nx', '@nx/*']
        applies-to: security-updates
      dev-deps:
        dependency-type: development
        update-types: ['minor', 'patch']
      prod-deps:
        dependency-type: production
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
