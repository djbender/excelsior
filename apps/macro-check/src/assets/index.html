<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spreadsheet Macro Check</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      #dropzone {
        border: 2px dashed transparent;
        border-radius: 0.5rem;
        padding: 1.5rem 1.5rem 1.5rem 0;
        margin-bottom: 1rem;
      }
      #dropzone.dragging {
        border-color: #888;
      }
      #dropzone.over {
        border-color: #1a56c4;
        background: #eef3fd;
      }
      #selected {
        margin: 0.75rem 0 0;
        padding-left: 1.25rem;
        max-height: 10rem;
        overflow-y: auto;
      }
      #selected:empty {
        display: none;
      }
      #result {
        margin-top: 1.5rem;
      }
      .summary {
        font-size: 1.1rem;
        font-weight: bold;
        margin-bottom: 0.75rem;
      }
      .result-card {
        border: 1px solid #ccc;
        border-left-width: 6px;
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        margin-bottom: 0.75rem;
      }
      .result-card.accepted {
        border-left-color: #146c2e;
      }
      .result-card.rejected {
        border-left-color: #a61b1b;
      }
      .result-head {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: baseline;
      }
      .result-name {
        font-family: ui-monospace, monospace;
        overflow-wrap: anywhere;
      }
      .result-card ul {
        margin: 0.5rem 0 0;
        padding-left: 1.25rem;
      }
      .verdict {
        font-weight: bold;
      }
      .accepted {
        color: #146c2e;
      }
      .rejected,
      .error {
        color: #a61b1b;
      }
    </style>
  </head>
  <body>
    <h1>Spreadsheet Macro Check</h1>
    <form id="form">
      <div id="dropzone">
        <label for="file">Spreadsheets (drop files here or choose)</label>
        <input id="file" name="files" type="file" multiple required />
        <ul id="selected"></ul>
      </div>
      <button type="submit">Inspect</button>
    </form>
    <div id="result" aria-live="polite"></div>

    <script>
      const MAX_TOTAL_BYTES = 50 * 1024 * 1024;
      const form = document.getElementById('form');
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('file');
      const selected = document.getElementById('selected');
      const result = document.getElementById('result');

      function text(tag, className, content) {
        const el = document.createElement(tag);
        if (className) el.className = className;
        el.textContent = content;
        return el;
      }

      function showSelected() {
        selected.replaceChildren(
          ...Array.from(fileInput.files, (file) => text('li', '', file.name)),
        );
      }

      function showMessage(className, message) {
        result.replaceChildren(text('div', 'verdict ' + className, message));
      }

      function summarize(results) {
        const rejected = results.filter((r) => r.verdict === 'rejected').length;
        const accepted = results.length - rejected;
        const summary = text(
          'div',
          'summary ' + (rejected ? 'rejected' : 'accepted'),
          accepted + ' accepted, ' + rejected + ' rejected',
        );
        return summary;
      }

      function showResults(results) {
        // Rejected files first: they are the ones that need attention.
        const ordered = [...results].sort(
          (a, b) => (b.verdict === 'rejected') - (a.verdict === 'rejected'),
        );
        result.replaceChildren(
          summarize(results),
          ...ordered.map((entry) => {
            const block = text('div', 'result-card ' + entry.verdict, '');
            const head = text('div', 'result-head', '');
            head.append(text('span', 'result-name', entry.name));
            head.append(
              text(
                'span',
                'verdict ' + entry.verdict,
                entry.verdict === 'accepted' ? 'ACCEPTED' : 'REJECTED',
              ),
            );
            block.append(head);
            if (entry.reasons.length) {
              const list = document.createElement('ul');
              for (const reason of entry.reasons) {
                list.append(text('li', '', reason.code + ': ' + reason.detail));
              }
              block.append(list);
            }
            return block;
          }),
        );
      }

      fileInput.addEventListener('change', showSelected);

      // The dashed border only shows while a drag is in progress anywhere on the page.
      document.addEventListener('dragover', () => {
        dropzone.classList.add('dragging');
      });
      document.addEventListener('dragleave', (event) => {
        // relatedTarget is null when the drag leaves the window.
        if (!event.relatedTarget) dropzone.classList.remove('dragging');
      });
      document.addEventListener('drop', () => {
        dropzone.classList.remove('dragging');
      });

      // Native HTML5 drag and drop: dragover must be cancelled for drop to fire.
      dropzone.addEventListener('dragover', (event) => {
        event.preventDefault();
        dropzone.classList.add('over');
      });
      dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('over');
      });
      dropzone.addEventListener('drop', (event) => {
        event.preventDefault();
        dropzone.classList.remove('over');
        if (event.dataTransfer.files.length) {
          fileInput.files = event.dataTransfer.files;
          showSelected();
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const files = Array.from(fileInput.files);
        if (!files.length) return;
        const totalBytes = files.reduce((sum, file) => sum + file.size, 0);
        if (totalBytes > MAX_TOTAL_BYTES) {
          showMessage(
            'error',
            'These files total ' +
              (totalBytes / 1048576).toFixed(1) +
              ' MB. The limit is 50 MB per batch. Remove some and try again.',
          );
          return;
        }
        const body = new FormData();
        for (const file of files) body.append('files', file);
        showMessage('', 'Inspecting…');
        try {
          const response = await fetch('/api/inspect-batch', {
            method: 'POST',
            body,
          });
          if (response.status === 413) {
            showMessage(
              'error',
              'The upload is over the size limit (25 MB per file, 50 MB per batch). Nothing was checked.',
            );
            return;
          }
          if (!response.ok) {
            showMessage(
              'error',
              'Server error (' + response.status + '). Nothing was checked.',
            );
            return;
          }
          const data = await response.json();
          showResults(data.results);
          // The results already name every file, so free the space the list used.
          selected.replaceChildren();
        } catch (error) {
          showMessage('error', 'Network error. Nothing was checked.');
        }
      });
    </script>
  </body>
</html>
